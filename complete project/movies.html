<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search | WebHub</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    
    <link rel="stylesheet" href="css/style.css">
</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-film"></i> WebHub
        </a>

        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="weather.html">Weather</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="movies.html">Movies</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="portfolio.html">Portfolio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg p-4">

                <h2 class="text-center mb-4">
                    🎬 Movie Search
                </h2>

                <div class="input-group mb-4">

                    <input
                        type="text"
                        id="movieInput"
                        class="form-control"
                        placeholder="Enter movie name...">

                    <button
                        class="btn btn-danger"
                        onclick="searchMovie()">

                        Search

                    </button>

                </div>

                <div id="movieResult" style="display:none;">

                    <div class="row">

                        <div class="col-md-4 text-center">

                            <img
                                id="poster"
                                class="img-fluid rounded shadow"
                                alt="Movie Poster">

                        </div>

                        <div class="col-md-8">

                            <h2 id="title"></h2>

                            <p><strong>Year:</strong> <span id="year"></span></p>

                            <p><strong>Genre:</strong> <span id="genre"></span></p>

                            <p><strong>Runtime:</strong> <span id="runtime"></span></p>

                            <p><strong>IMDb Rating:</strong> <span id="rating"></span></p>

                            <p><strong>Director:</strong> <span id="director"></span></p>

                            <p><strong>Actors:</strong> <span id="actors"></span></p>

                            <p><strong>Language:</strong> <span id="language"></span></p>

                        </div>

                    </div>

                    <hr>

                    <h5>Plot</h5>

                    <p id="plot"></p>

                </div>

                <div
                    id="movieError"
                    class="alert alert-danger mt-3"
                    style="display:none;">

                </div>

            </div>

        </div>

    </div>

</section>

<footer class="bg-dark text-white text-center p-3">

    <p class="mb-0">
        © 2026 WebHub | Movie Search Application
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/movies.js"></script>

</body>

</html>
